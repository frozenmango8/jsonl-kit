[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsonl-kit"
description = "Streaming commands for JSON Lines files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "frozenmango8" }]
keywords = ["jsonl", "jsonlines", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
jsonl = "jsonl_kit.cli:console_main"

[tool.hatch.version]
path = "src/jsonl_kit/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
